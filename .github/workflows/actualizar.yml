name: Actualizar Enlace OKRU en Archivo XOY

on:
  schedule:
    # Se ejecuta de manera automática cada 24 horas (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Activa el botón gris para probarlo de manera manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio donde acabas de guardar el script de Python
    - name: Clonar repositorio principal
      uses: actions/checkout@v4

    # 2. Clonar tu repositorio de canales (TV-XOY/XOY) en la carpeta 'otro-repo'
    - name: Clonar tu repositorio XOY
      uses: actions/checkout@v4
      with:
        repository: 'TV-XOY/XOY'
        path: 'otro-repo'
        token: ${{ secrets.PAT_OTRO_REPO }}

    # 3. Levantar entorno Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Instalar Streamlink (simulador de reproducción)
    - name: Instalar Streamlink
      run: |
        python -m pip install --upgrade pip
        pip install streamlink

    # 5. Ejecutar el script que lee XOY, ignora la línea de Kodi y cambia el enlace
    - name: Ejecutar Script de Actualización
      run: python actualizar_m3u.py

    # 6. Guardar el archivo XOY modificado y subirlo a tu cuenta de GitHub
    - name: Guardar y subir cambios a tu repositorio XOY
      run: |
        cd otro-repo
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add XOY
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización enlace CANAL 13 [Bot]" && git push)
