name: Actualizar URL M3U8 de OK.ru

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar yt-dlp y dependencias
      run: |
        python -m pip install --upgrade pip
        # Instalamos yt-dlp que maneja mucho mejor las cookies y tokens de OK.ru
        pip install yt-dlp

    - name: Ejecutar script de actualización
      run: python actualizar_lista.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add XOY
        git diff-index --quiet HEAD || git commit -m "Automatizado: URL de Canal 13 Mérida actualizada"
        git push
