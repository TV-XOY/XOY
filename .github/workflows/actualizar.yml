name: Actualizar URL M3U8 de OK.ru

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar y Configurar Tor
      run: |
        sudo apt-get update
        sudo apt-get install -y tor curl
        
        # NOTA: Si el circuito falla, considera comentar estas dos líneas 
        # debido a la escasez de nodos de salida en México ({mx})
        echo "ExitNodes {mx}" | sudo tee -a /etc/tor/torrc
        echo "StrictNodes 1" | sudo tee -a /etc/tor/torrc
        
        sudo service tor restart
        
        # Bucle de espera inteligente: Verifica que Tor esté realmente listo y navegando
        echo "Esperando a que el circuito de Tor se estabilice..."
        for i in {1..10}; do
          if curl --socks5-hostname 127.0.0.1:9050 -s https://torproject.org | grep -q "Congratulations"; then
            echo "¡Conexión a Tor establecida con éxito!"
            break
          fi
          echo "Intento $i: Tor aún no está listo, esperando 3 segundos..."
          sleep 3
        done

    - name: Instalar yt-dlp con soporte de simulación completo
      run: |
        python -m pip install --upgrade pip
        pip install "yt-dlp[default,curl_cffi]"

    - name: Ejecutar script de actualización
      run: python actualizar_lista.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add XOY
        # Commitea solo si hay cambios reales en el archivo XOY
        if ! git diff --cached --quiet; then
          git commit -m "Automatizado: URL de Canal 13 Mérida actualizada"
          git push
        else
          echo "No se detectaron cambios en el archivo XOY. Saltando commit."
        fi
