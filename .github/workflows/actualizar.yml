name: Actualizar Enlace OKRU en Archivo XOY

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite activarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio principal (Donde tienes la Action corriendo)
    - name: Clonar repositorio principal
      uses: actions/checkout@v4

    # 2. Clonar tu repositorio XOY (Que pertenece a tu propio usuario)
    - name: Clonar tu repositorio XOY
      uses: actions/checkout@v4
      with:
        # 🔴 REEMPLAZA 'TU_PROPIO_USUARIO' CON TU NOMBRE DE USUARIO REAL
        repository: 'TV-XOY/XOY'
        # Se descarga dentro de esta subcarpeta para que el script de Python lo encuentre
        path: 'otro-repo'
        # Tu token secreto para que la Action pueda guardar los cambios en tu repo XOY
        token: ${{ secrets.PAT_OTRO_REPO }}

    # 3. Configurar Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 4. Instalar Streamlink para extraer el enlace de OK.ru
    - name: Instalar Streamlink
      run: |
        python -m pip install --upgrade pip
        pip install streamlink

    # 5. Ejecutar el script que busca y modifica el archivo XOY
    - name: Ejecutar Script de Actualización
      run: python actualizar_m3u.py

    # 6. Entrar a la carpeta de tu repo XOY y subir los cambios a tu cuenta
    - name: Guardar y subir cambios a tu repositorio XOY
      run: |
        cd otro-repo
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add XOY
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización enlace OK.ru en archivo XOY [Bot]" && git push)
