import os
import subprocess

# CONFIGURACIÓN GENERAL
URL_OKRU = "https://ok.ru/live/10849691639514"
ARCHIVO_M3U = "TV-XOY/XOY/"  # Nombre de tu lista sin extensión dentro del repositorio clonado
IDENTIFICADOR = 'tvg-name="CANAL13.mx"'  # Identificador clave de tu canal

def obtener_enlace_m3u8():
    try:
        print("Iniciando extracción del enlace dinámico desde OK.ru...")
        # Usa Streamlink para simular el reproductor y obtener la URL .m3u8 directa de 24 horas
        resultado = subprocess.run(
            ["streamlink", URL_OKRU, "best", "--stream-url"],
            capture_output=True, text=True, check=True
        )
        url_extraida = resultado.stdout.strip()
        if "m3u8" in url_extraida:
            print("¡Enlace m3u8 extraído con éxito!")
            return url_extraida
        print("Error: No se encontró un enlace m3u8 válido en la extracción.")
        return None
    except Exception as e:
        print(f"Error crítico durante la extracción con Streamlink: {e}")
        return None

def actualizar_linea_m3u(nueva_url):
    if not os.path.exists(ARCHIVO_M3U):
        print(f"Error crítico: El archivo '{ARCHIVO_M3U}' no existe. Verifica la ruta.")
        return

    with open(ARCHIVO_M3U, "r", encoding="utf-8") as f:
        lineas = f.readlines()

    nuevas_lineas = []
    modificado = False
    encontrado_canal = False

    print(f"Procesando el archivo XOY para localizar {IDENTIFICADOR}...")

    for linea in lineas:
        # Si ya pasamos por el #EXTINF del canal y encontramos la línea de la URL (que empieza con http)
        if encontrado_canal and (linea.strip().startswith("http://") or linea.strip().startswith("https://")):
            nuevas_lineas.append(nueva_url + "\n")
            encontrado_canal = False  # Desactivamos la alerta ya que cumplió su objetivo
            modificado = True
            print("-> Se localizó la URL vieja y se reemplazó correctamente.")
        else:
            nuevas_lineas.append(linea)
            # Si el script lee la línea de cabecera de tu canal, se activa la alerta para buscar la URL más abajo
            if "#EXTINF" in linea and IDENTIFICADOR in linea:
                encontrado_canal = True

    if modificado:
        with open(ARCHIVO_M3U, "w", encoding="utf-8") as f:
            f.writelines(nuevas_lineas)
        print("¡Proceso terminado con éxito! El archivo XOY ha sido actualizado.")
    else:
        print(f"⚠️ Error: No se pudo realizar el cambio. Comprueba que tu canal contenga {IDENTIFICADOR}.")

if __name__ == "__main__":
    enlace = obtener_enlace_m3u8()
    if enlace:
        actualizar_linea_m3u(enlace)
