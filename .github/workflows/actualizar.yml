name: Actualizar URL M3U8 de OK.ru

on:
  schedule:
    # Se ejecuta de manera automática cada 12 horas para evitar la expiración del enlace
    - cron: '0 */12 * * *'
  workflow_dispatch: # Te permite activar el script manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permiso crucial para que el bot pueda guardar los cambios en tu lista de GitHub

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install streamlink

    - name: Ejecutar script de actualización
      run: python actualizar_lista.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add XOY
        # Solo hace el commit si el archivo sufrió cambios en la URL
        git diff-index --quiet HEAD || git commit -m "Automatizado: URL de Canal 13 Mérida actualizada"
        git push
