name: Actualizar URL M3U8 de OK.ru

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar y Configurar Tor (Prioridad México)
      run: |
        sudo apt-get update
        sudo apt-get install -y tor tor-geoipdb
        
        # Preferimos México {mx} como primera opción de salida
        echo "ExitNodes {mx}" | sudo tee -a /etc/tor/torrc
        
        # Reiniciamos el servicio
        sudo service tor restart
        echo "Esperando estabilización del túnel..."
        sleep 10

    - name: Instalar yt-dlp con soporte de simulación completo
      run: |
        python -m pip install --upgrade pip
        pip install "yt-dlp[default,curl_cffi]"

    - name: Ejecutar script de actualización
      run: python actualizar_lista.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add XOY
        git diff-index --quiet HEAD || git commit -m "Automatizado: URL de Canal 13 Mérida actualizada (480p)"
        git push
