name: Actualizar URL M3U8 de OK.ru

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar y Configurar Tor para México
      run: |
        sudo apt-get update
        # Instalamos tor junto con la base de datos de geolocalización (geoip)
        sudo apt-get install -y tor tor-geoipdb
        
        # Configuramos Tor para que use EXCLUSIVAMENTE nodos de salida de México ({mx})
        # StrictNodes 1 obliga a cumplir la regla estrictamente sin excepciones
        echo "ExitNodes {mx}" | sudo tee -a /etc/tor/torrc
        echo "StrictNodes 1" | sudo tee -a /etc/tor/torrc
        
        # Reiniciamos el servicio de Tor para aplicar los cambios de región
        sudo service tor restart
        
        printenv
        echo "Esperando a que el circuito de Tor se establezca en México..."
        sleep 15 # Aumentamos el tiempo para garantizar un circuito MX estable

    - name: Verificar IP de Tor (Filtro Geobloqueo)
      run: |
        # Probamos la IP pública usando el proxy Tor para validar el país antes de seguir
        echo "Verificando geolocalización de la IP asignada..."
        curl --socks5-hostname 127.0.0.1:9050 https://ipinfo.io || echo "No se pudo verificar IP, continuando..."

    - name: Instalar yt-dlp con soporte de simulación completo
      run: |
        python -m pip install --upgrade pip
        pip install "yt-dlp[default,curl_cffi]"

    - name: Ejecutar script de actualización
      run: python actualizar_lista.py

    - name: Subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add XOY
        git diff-index --quiet HEAD || git commit -m "Automatizado: URL de Canal 13 Mérida actualizada (480p MX)"
        git push
